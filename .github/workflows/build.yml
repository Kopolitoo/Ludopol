# Automatic build (continuous integration, "CI").
#
# On every pull request and every push to main, GitHub starts a Windows machine,
# checks the language files, compiles Ludopol and makes its installer (Setup.exe, with Inno
# Setup). The result (green tick or red cross) shows on the pull request. The installer is kept
# for 14 days ("Ludopol-setup" artifact of the run), to try a pull request without compiling
# it: unzip it and double-click Ludopol-<version>-setup.exe. .NET 8 is inside the program
# ("self-contained"), nothing else to install.

name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check the language files
        shell: pwsh
        run: ./.github/scripts/check-data-files.ps1

      - name: Compile Ludopol
        run: dotnet publish Ludopol.csproj --configuration Release --runtime win-x64 --self-contained true --output bin/publish

      # The installer of this same build. Its version number is the <Version> of Ludopol.csproj.
      - name: Make the installer (Setup.exe)
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Ludopol.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          ./.github/scripts/make-setup.ps1 bin/publish $version bin/setup

      - name: Keep the installer
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Ludopol-setup
          path: bin/setup/
          retention-days: 14
